name: check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: kveritas-linux-amd64
          - os: macos-latest
            bin: kveritas-darwin-arm64
          - os: windows-latest
            bin: kveritas-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: checksums
        run: |
          cd bin
          python -c "import hashlib,sys; bad=[n for h,n in (l.split() for l in open('SHA256SUMS')) if hashlib.sha256(open(n,'rb').read()).hexdigest()!=h]; sys.exit('mismatch: %s' % bad if bad else 0)"
      - name: binary is the current build
        run: |
          read VERSION COMMIT < <(tr -d '\r' < bin/BUILD)
          chmod +x "bin/${{ matrix.bin }}"
          out=$("bin/${{ matrix.bin }}" version)
          echo "$out"
          echo "$out" | grep -F "kveritas $VERSION " | grep -F "commit $COMMIT)"
      - name: pip install from the releases repo
        run: |
          read VERSION COMMIT < <(tr -d '\r' < bin/BUILD)
          # GitHub Pages publishes a push within a few minutes.
          for i in $(seq 1 28); do curl -fsSL https://27-group.github.io/kveritas-releases/wheels/ | grep -q "kveritas-$VERSION-" && break; sleep 15; done
          python -m venv venv
          PY=venv/bin/python; [ -f venv/Scripts/python.exe ] && PY=venv/Scripts/python.exe
          "$PY" -m pip install -q --no-cache-dir "kveritas==$VERSION" --find-links https://27-group.github.io/kveritas-releases/wheels/
          "$PY" -c "import shutil,subprocess,sys,os; exe=shutil.which('kveritas', path=os.path.dirname(sys.executable)); print(subprocess.run([exe,'version'],capture_output=True,text=True).stdout)" | grep -F "commit $COMMIT)"
